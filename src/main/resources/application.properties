# The real database connection, already set up on the WildFly server itself
# (checked directly in standalone.xml on 2026-09-15) - points to the test
# database billhsbhq, server testbulkinfdb1. No username/password needed
# here: WildFly holds those, this app only asks for the connection by name.
spring.datasource.jndi-name=java:/InformixDSSPS

server.port=8080

logging.level.root=INFO
logging.level.com.hsb.createhsbbill=DEBUG

# We are not using JPA/Hibernate (see BillPrintFieldRepository for why),
# so there is nothing for Hibernate to create, change, or check.
spring.jpa.hibernate.ddl-auto=none
